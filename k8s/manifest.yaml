
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: nextgen-app
    spec:
      replicas: 3
      selector:
        matchLabels:
          app: nextgen-app
      template:
        metadata:
          labels:
            app: nextgen-app
        spec:
          containers:
          - name: nextgen-app
            image: 'nginx:1.25-alpine'
            ports:
            - containerPort: 80
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 200m
                memory: 256Mi
            livenessProbe:
              httpGet:
                path: /
                port: 80
              initialDelaySeconds: 15
              periodSeconds: 15
            readinessProbe:
              httpGet:
                path: /
                port: 80
              initialDelaySeconds: 5
              periodSeconds: 10
  
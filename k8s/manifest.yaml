apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextgen-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nextgen-app
  template:
    metadata:
      labels:
        app: nextgen-app
    spec:
      containers:
      - name: nextgen-app
        image: bgoussama/nextgen-app:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelay: 15
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelay: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: nextgen-app
spec:
  selector:
    app: nextgen-app
  ports:
  - name: http
    port: 80
    targetPort: 80
  type: LoadBalancer